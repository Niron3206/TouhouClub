networks:
  default:
    ipam:
      config:
        # фиксированная подсеть, чтобы у proxy был постоянный адрес для dns:
        - subnet: 172.28.0.0/24

services:
  # vless-туннель для узла и DNS через DoH
  proxy:
    image: ghcr.io/xtls/xray-core:26.9.9
    container_name: touhouclub-proxy
    command: run -c /etc/xray/config.json
    # ключи тут, файл в .gitignore, образец в proxy/config.example.json
    volumes:
      - ./proxy/config.json:/etc/xray/config.json:ro
    sysctls:
      - net.ipv4.ip_unprivileged_port_start=0
    networks:
      default:
        ipv4_address: 172.28.0.53
    restart: unless-stopped

  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    container_name: touhouclub-cipher
    environment:
      - OVERRIDE_PLAYER_VARIANT=IAS
    # ходит к ютубу сам, поэтому резолвер нужен ему не меньше, чем узлу
    dns:
      - 172.28.0.53
    depends_on:
      - proxy
    restart: unless-stopped

  # ютуб и голос теперь на узле, поэтому резолвер и токен нужны ему
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: touhouclub-lavalink
    env_file: .env
    environment:
      - YT_CIPHER_URL=http://yt-cipher:8001
      # negative.ttl=0: один сбой резолва иначе выкашивает всю очередь
      # socks: весь http узла через туннель, голос идёт напрямую
      - _JAVA_OPTIONS=-Dnetworkaddress.cache.negative.ttl=0 -DsocksProxyHost=proxy -DsocksProxyPort=1080 -DsocksNonProxyHosts=yt-cipher|localhost|127.*
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    dns:
      - 172.28.0.53
    depends_on:
      - proxy
      - yt-cipher
    restart: unless-stopped

  bot:
    build: .
    container_name: touhouclub
    env_file: .env
    environment:
      - LAVALINK_URL=ws://lavalink:2333
    dns:
      - 172.28.0.53
    depends_on:
      - proxy
      - lavalink
    restart: unless-stopped
