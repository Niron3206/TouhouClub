server:
  address: 0.0.0.0
  port: 2333

lavalink:
  server:
    password: "${LAVALINK_PASSWORD:youshallnotpass}"
    # 3 секунд по умолчанию до googlevideo не хватает
    timeouts:
      connectTimeoutMs: 10000
      connectionRequestTimeoutMs: 10000
      socketTimeoutMs: 15000
    # с такими таймаутами 10 секунд по умолчанию объявляют зависшим живой трек
    trackStuckThresholdMs: 15000
    sources:
      # ютуб отдаёт плагин, встроенный источник выключен
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:2be8e542d3f6f178e048dca565892684c2e40177"
      repository: "https://maven.lavalink.dev/snapshots"
      snapshot: true

plugins:
  youtube:
    enabled: true
    clients: ["TV", "MUSIC", "TVHTML5_SIMPLY", "ANDROID_VR", "MWEB", "WEB", "WEBEMBEDDED"]
    oauth:
      enabled: true
      refreshToken: "${YT_OAUTH_REFRESH_TOKEN:}"
    remoteCipher:
      url: "${YT_CIPHER_URL:http://yt-cipher:8001}"

logging:
  level:
    root: INFO
    lavalink: INFO
